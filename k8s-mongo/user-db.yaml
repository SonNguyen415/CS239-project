apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: user-db-pvc
  labels:
    io.kompose.service: user-db
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 8Gi 
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: user-db
  name: user-db
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: user-db
  template:
    metadata:
      labels:
        io.kompose.service: user-db
    spec:
      nodeSelector:                    
        workload-type: mongo
      containers:
        - image: weaveworksdemos/user-db:0.4.0
          name: user-db
          ports:
            - containerPort: 27017
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi  
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - mountPath: /data/db
              name: user-db-pvc
      restartPolicy: Always
      volumes:
        - name: user-db-pvc
          persistentVolumeClaim:
            claimName: user-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: user-db
  name: user-db
spec:
  ports:
    - name: "27017"
      port: 27017
      targetPort: 27017
  selector:
    io.kompose.service: user-db