apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.37.0 (HEAD)
  labels:
    io.kompose.service: ycsb-interface
  name: ycsb-interface
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: ycsb-interface
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.37.0 (HEAD)
      labels:
        io.kompose.service: ycsb-interface
    spec:
      containers:
        - image: ycsb-combined:latest
          name: ycsb-interface
          ports:
            - containerPort: 8000
              protocol: TCP
          stdin: true
          tty: true
          volumeMounts:
            - mountPath: /results
              name: ycsb-results
      restartPolicy: Always
      volumes:
        - name: ycsb-results
          persistentVolumeClaim:
            claimName: ycsb-results
