apiVersion: v1
data:
  prometheus.yml: |-
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'ycsb-exporter'
        static_configs:
          - targets: ['ycsb_interface:8000']
        scrape_interval: 5s

      - job_name: 'mongodb'
        static_configs:
          - targets: ['user-db:27017']



    # global:
    #   scrape_interval: 15s
    #   evaluation_interval: 15s

    # scrape_configs:
    #   - job_name: 'prometheus'
    #     static_configs:
    #       - targets: ['localhost:9090']

    #   - job_name: 'ycsb-exporter'
    #     static_configs:
    #       - targets: ['ycsb-exporter:8000']
    #     scrape_interval: 5s

    #   - job_name: 'mongodb'
    #     static_configs:
    #       - targets: ['user-db:27017']
kind: ConfigMap
metadata:
  annotations:
    use-subpath: "true"
  labels:
    io.kompose.service: prometheus
  name: prometheus-cm0
