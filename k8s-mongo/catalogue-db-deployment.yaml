apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.37.0 (HEAD)
  labels:
    io.kompose.service: catalogue-db
  name: catalogue-db
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: catalogue-db
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.37.0 (HEAD)
      labels:
        io.kompose.service: catalogue-db
    spec:
      containers:
        - env:
            - name: MYSQL_ALLOW_EMPTY_PASSWORD
              value: "true"
            - name: MYSQL_DATABASE
              value: socksdb
            - name: MYSQL_ROOT_PASSWORD
          image: weaveworksdemos/catalogue-db:0.3.0
          name: catalogue-db
      hostname: catalogue-db
      restartPolicy: Always
